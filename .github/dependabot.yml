version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    assignees:
      - arch-fan
    # Titles become "chore(deps): ..." / "chore(deps-dev): ...".
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
    ignore:
      # The library supports Effect 3 (peer range <4); moving to Effect 4 is a
      # breaking change done by hand.
      - dependency-name: effect
        update-types: ["version-update:semver-major"]
      # @types/bun follows the Bun version pinned in mise.toml, bumped by hand.
      - dependency-name: "@types/bun"
    groups:
      effect:
        patterns:
          - effect
          - "@effect/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Titles become "ci(deps): ...".
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
