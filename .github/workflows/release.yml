name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: bun run check

      - run: bun test

      - run: bun run build

      # Trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
