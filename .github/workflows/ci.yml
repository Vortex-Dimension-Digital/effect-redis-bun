name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the Bun version pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun fmt --check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Package contents
        run: bun pm pack --dry-run

  test:
    name: Test (Bun ${{ matrix.bun }}, Effect ${{ matrix.effect.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 1.2.22 is the minimum in package.json engines.
        bun: ["1.2.22", latest]
        effect:
          # Lower bounds of the peer dependency ranges.
          - name: "3.1.2"
            install: effect@3.1.2 @effect/platform@0.52.3
          - name: locked
    env:
      MISE_BUN_VERSION: ${{ matrix.bun }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile

      - name: Install Effect ${{ matrix.effect.name }}
        if: matrix.effect.install
        run: bun add --dev ${{ matrix.effect.install }}

      - run: bun test

  integration:
    name: Integration (Bun ${{ matrix.bun }}, ${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Each server gets its own host port: the job reaches it on 127.0.0.1
        # both on GitHub and under act (which runs jobs on the host network and
        # does not expose job.services), and parallel act jobs do not collide.
        include:
          # Minimum supported Bun and Redis.
          - bun: "1.2.22"
            server: redis:7.2
            port: 16379
          - bun: latest
            server: redis:8
            port: 16380
          - bun: latest
            server: valkey/valkey:9
            port: 16381
    env:
      MISE_BUN_VERSION: ${{ matrix.bun }}
    services:
      redis:
        image: ${{ matrix.server }}
        ports:
          - ${{ matrix.port }}:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile

      - name: Integration tests
        env:
          REDIS_URL: redis://127.0.0.1:${{ matrix.port }}/15
          REDIS_ALLOW_DESTRUCTIVE: "1"
        run: bun run test:integration

  # Single required status check for branch protection.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [check, test, integration]
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job finished with: $result"
              exit 1
            fi
          done
